# Database recovery, as a workflow a deployment can enable.
#
# Restores an environment's database to a new RDS instance, cuts the app over to it through
# Terraform and checks the result, by running `make db-recover`, the same target an operator
# runs from a workstation. Triggered by hand only. Runbook: docs/runbooks/prod-db-recovery.md.
#
# This repository runs no workflow of its own. To run this one in yours:
#
#   1. Copy this file to .github/workflows/db-recover.yml.
#   2. Uncomment everything below the line of dashes.
#   3. Set `runs-on` to runners your organisation allows.
#   4. Create a GitHub Environment for each environment you deploy, dev and prod, holding:
#        DB_RECOVER_ROLE_ARN  A variable: the role the job assumes through GitHub OIDC. It
#                             needs the permissions the runbook lists and what a terraform
#                             apply of the environment needs, its state bucket included, and
#                             a maximum session of at least six hours.
#        TF_BACKEND_HCL       A variable: the environment's backend.hcl, which is
#                             infra/bootstrap's output environment_backend_config.
#        NAME_PREFIX          A variable: the stack's name_prefix, if it is not ztdr.
#        TF_AUTO_TFVARS       A secret: every input your workstation supplies to the
#                             environment's stack from a *.auto.tfvars file, such as vpc_id,
#                             subnet_name_prefix, app_fqdn and alarm_email_endpoints. A plan
#                             missing a required input fails, and one missing an optional
#                             input the deployment sets plans a change the cutover refuses.
#   5. Give the prod Environment a deployment protection rule that requires approval, so a
#      prod run waits until someone named in the rule approves it, and restrict its
#      deployment branches to your default branch, so a run never executes unmerged code.
#
# With the execute box unticked, the default, the run prints every step and calls nothing,
# and no credentials are requested. A GitHub-hosted job stops after six hours; a restore
# that takes longer is resumed by running the workflow again with the same inputs.
#
# Actions are pinned to full commit SHAs; keep them pinned when you update them.
