# Standard's gates, as a workflow a fork can enable.
#
# This repository runs no CI of its own. Every gate below runs from a `make`
# target, so it runs the same way on a laptop as in a pipeline. To run them in
# your own CI:
#
#   1. Copy this file to .github/workflows/gates.yml.
#   2. Uncomment everything below the line of dashes.
#   3. Set `runs-on` to runners your organisation allows. The image is built for
#      linux/arm64, so the build and container jobs want an ARM runner, or QEMU
#      on an x86 one.
#   4. For the build and container jobs, add DHI_USERNAME and DHI_PASSWORD
#      secrets: the base images come from dhi.io, which needs a login.
#
# What each gate proves:
#   Code
#     make ci-check         ESLint and the TypeScript compiler with no errors, every committed
#                           image tag a version this repository has cut, and every URL in the
#                           committed seed SQL well formed.
#     make ci-test          The unit tests, with the coverage floor. They include the
#                           catalog-boundary tests (the server refuses to serve another
#                           catalog's vocabulary) and the vocabulary gate over everything
#                           the repository ships, tests and comments included, plus the
#                           pytest suites for the Python checkers and the shell scripts.
#     make db-seed-check    The seed checks, run against the seed SQL actually committed.
#                           ci-test and db-seed-check between them cover every test area
#                           in docs/testing.md, so make test-matrix needs no job of its own.
#   Build
#     make container-build  The runner image builds, and `next build` with it, so a
#                           production-build break fails here.
#   Container
#     make container-verify The image carries every file the runtime needs.
#     make container-scan   No HIGH or CRITICAL CVE with a fix available in the image.
#     make refresh-image-digests, then an unchanged Dockerfile
#                           The pinned base images are the digests their tags point at
#                           today. Why: docs/scripts/refresh-image-digests.md.
#     make check-rds-bundle The Dockerfile's RDS CA bundle pin matches the bundle AWS
#                           serves today. Why: docs/scripts/check-rds-bundle.md. The
#                           image pins the bundle by checksum, and AWS republishes it
#                           when it adds a Region, after which every image build fails.
#
# The base-image and RDS bundle gates check things that change upstream, not in
# this repository, so the workflow also runs weekly; the other jobs skip that run.
#
# Actions are pinned to full commit SHAs; keep them pinned when you update them.
