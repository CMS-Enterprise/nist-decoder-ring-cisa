# Yarn 4 settings for the app.

# Run the release committed under .yarn/releases, so whichever yarn is on PATH
# (Yarn 1 on a CI runner and in the build image, Corepack locally) hands off
# to the same version. package.json's packageManager names the same release.
yarnPath: .yarn/releases/yarn-4.18.1.cjs

# Install into node_modules, as Yarn 1 did, rather than Plug'n'Play.
nodeLinker: node-modules

# Yarn 4 sends usage telemetry unless this is off.
enableTelemetry: false

# Dependencies' install scripts run only where package.json's dependenciesMeta
# allows them. It allows Prisma's two packages, which fetch the schema engine
# that migrations run, and marks every other install script off by name, so a
# new dependency that brings one shows up as a warning on install.
enableScripts: false

# Install releases however recently they were published, as Yarn 1 did. Yarn
# 4's default holds back anything under a day old; turning that on would pair
# with a Dependabot cooldown, which applies the same gate to its own updates.
npmMinimalAgeGate: 0
